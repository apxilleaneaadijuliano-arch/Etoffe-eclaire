<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fabric Collection</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <section
      class="carousel"
      aria-roledescription="carousel"
      aria-label="Fabric collection"
    >
      <div class="carousel__viewport">
        <div class="carousel__track">
          <figure class="carousel__slide is-active">
            <img
              src="images/fabric-1.jpg"
              alt="Ivory fabric arranged in broad, soft folds"
            >
          </figure>

          <figure class="carousel__slide">
            <img
              src="images/fabric-2.jpg"
              alt="Close-up view of textured cream fabric"
              loading="lazy"
            >
          </figure>

          <figure class="carousel__slide">
            <img
              src="images/fabric-3.jpg"
              alt="Natural ivory fabric with a fine woven texture"
              loading="lazy"
            >
          </figure>

          <figure class="carousel__slide">
            <img
              src="images/fabric-4.jpg"
              alt="Smooth ivory satin flowing in soft folds"
              loading="lazy"
            >
          </figure>
        </div>

        <button
          class="carousel__button carousel__button--previous"
          type="button"
          aria-label="Show previous image"
        >
          &#10094;
        </button>

        <button
          class="carousel__button carousel__button--next"
          type="button"
          aria-label="Show next image"
        >
          &#10095;
        </button>

        <p class="carousel__counter" aria-live="polite">
          <span id="current-slide">1</span> / 4
        </p>
      </div>

      <div class="carousel__dots" aria-label="Choose an image">
        <button
          class="carousel__dot is-active"
          type="button"
          aria-label="Show image 1"
          aria-current="true"
        ></button>

        <button
          class="carousel__dot"
          type="button"
          aria-label="Show image 2"
        ></button>

        <button
          class="carousel__dot"
          type="button"
          aria-label="Show image 3"
        ></button>

        <button
          class="carousel__dot"
          type="button"
          aria-label="Show image 4"
        ></button>
      </div>
    </section>
  </main>
</body>
</html>
