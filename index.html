<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabric Texture Carousel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 600px;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      background-color: #fff;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.8);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .nav-button:hover {
      background-color: #ffffff;
      transform: translateY(-50%) scale(1.05);
    }

    .prev-btn { left: 12px; }
    .next-btn { right: 12px; }

    .dots-container {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background-color: #ffffff;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-track" id="track">
      <div class="carousel-slide">
        <img src="images/fabric-1.jpg" alt="Draped Cream Fabric">
      </div>
      <div class="carousel-slide">
        <img src="images/fabric-2.jpg" alt="Silk Satin Fabric">
      </div>
      <div class="carousel-slide">
        <img src="images/fabric-3.jpg" alt="Textured Knit Fabric">
      </div>
      <div class="carousel-slide">
        <img src="images/fabric-4.jpg" alt="Linen Weave Fabric">
      </div>
    </div>

    <button class="nav-button prev-btn" id="prevBtn" aria-label="Previous Slide">&#10094;</button>
    <button class="nav-button next-btn" id="nextBtn" aria-label="Next Slide">&#10095;</button>

    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <script>
    const track = document.getElementById('track');
    const slides = Array.from(track.children);
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');

    let currentIndex = 0;

    // Create dot indicators dynamically
    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => moveToSlide(index));
      dotsContainer.appendChild(dot);
    });

    const dots = Array.from(dotsContainer.children);

    function updateDots(index) {
      dots.forEach(dot => dot.classList.remove('active'));
      dots[index].classList.add('active');
    }

    function moveToSlide(index) {
      if (index < 0) {
        currentIndex = slides.length - 1;
      } else if (index >= slides.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      updateDots(currentIndex);
    }

    prevBtn.addEventListener('click', () => moveToSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => moveToSlide(currentIndex + 1));
  </script>

</body>
</html>
